suite: SCI sysext consumer init container (neutron-hypervisor-agents)
templates:
  - templates/*.yaml
  - templates/bin/*.tpl
  - templates/etc/*.tpl
values:
  - ../ci/test-values.yaml
set:
  ovn.external_ids.OvnRemote: "tcp:192.0.2.10:6642"
tests:
  - it: fails to render with the migration message when ovsOnHost is false
    template: templates/daemonset-ovn-controller.yaml
    set:
      ovsOnHost: false
    asserts:
      - failedTemplate:
          errorPattern: "ovsOnHost: true"
      - failedTemplate:
          errorPattern: "sciSysext"

  - it: renders no consumer init, no host-root volume and no hostIPC on ovn-controller when sciSysext is empty
    template: templates/daemonset-ovn-controller.yaml
    set:
      ovsOnHost: true
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: sci-sysext-consumer
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: host-root
          any: true
      - isNull:
          path: spec.template.spec.hostIPC
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: configure-host-ovs

  - it: refuses a partially configured sciSysext block
    template: templates/daemonset-ovn-controller.yaml
    set:
      ovsOnHost: true
      sciSysext.image: "registry.example.com/sci-consumer@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - failedTemplate:
          errorPattern: "set image, release.url, release.sumsDigest, publicKey and extensions together"

  - it: refuses a sumsDigest that is not a sha256
    template: templates/daemonset-ovn-controller.yaml
    values:
      - sci-sysext-values.yaml
    set:
      ovsOnHost: true
      sciSysext.release.sumsDigest: "not-a-digest"
    asserts:
      - failedTemplate:
          errorPattern: "sumsDigest must be 64 lowercase hex"

  - it: refuses an extension name that could traverse
    template: templates/daemonset-ovn-controller.yaml
    values:
      - sci-sysext-values.yaml
    set:
      ovsOnHost: true
      sciSysext.extensions:
        - "../sci-10-base"
    asserts:
      - failedTemplate:
          errorPattern: "invalid extension name"

  - it: renders the consumer before configure-host-ovs and enables hostIPC on ovn-controller
    template: templates/daemonset-ovn-controller.yaml
    values:
      - sci-sysext-values.yaml
    set:
      ovsOnHost: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: sci-sysext-consumer
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "registry.example.com/sci-consumer@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: configure-host-ovs
      - equal:
          path: spec.template.spec.hostIPC
          value: true
      - equal:
          path: spec.template.spec.hostPID
          value: true

  - it: passes the release contract to the ovn-controller consumer
    template: templates/daemonset-ovn-controller.yaml
    values:
      - sci-sysext-values.yaml
    set:
      ovsOnHost: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: HOST_ROOT
              value: /host
            - name: SCI_RELEASE_URL
              value: "https://github.com/gardenlinux/gardenlinux-sci/releases/download/2150.9.0-g00a1df9"
            - name: SCI_SUMS_DIGEST
              value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: SCI_PUBKEY
              value: "-----BEGIN PUBLIC KEY-----\nMFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAK0123456789abcdef\n-----END PUBLIC KEY-----\n"
            - name: SCI_EXTENSIONS
              value: "sci-10-base sci-21-network"
            - name: SCI_DEADLINE
              value: "900"
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
            appArmorProfile:
              type: Unconfined
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-root
            mountPath: /host
            mountPropagation: HostToContainer
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-root
            hostPath:
              path: /
              type: Directory

  - it: renders no consumer init but keeps hostIPC on the openvswitch-agent when sciSysext is empty
    template: templates/daemonset-openvswitch-agent.yaml
    set:
      ovsOnHost: true
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: sci-sysext-consumer
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: host-root
          any: true
      - equal:
          path: spec.template.spec.hostIPC
          value: true

  - it: renders the consumer with the release contract on the openvswitch-agent
    template: templates/daemonset-openvswitch-agent.yaml
    values:
      - sci-sysext-values.yaml
    set:
      ovsOnHost: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: sci-sysext-consumer
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "registry.example.com/sci-consumer@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - equal:
          path: spec.template.spec.initContainers[0].env[4].name
          value: SCI_EXTENSIONS
      - equal:
          path: spec.template.spec.initContainers[0].env[4].value
          value: "sci-10-base sci-21-network"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-root
            hostPath:
              path: /
              type: Directory

  - it: never renders the retired standalone delivery DaemonSet
    template: templates/daemonset-ovn-controller.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sci-sysext-delivery
        not: true
