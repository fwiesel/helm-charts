defaults:
  network:
    ovs:
      pod:
        nodeSelector:
          neutron.openstack.cloud.sap/ml2-mechanism-driver: ovs
    ovn:
      pod:
        nodeSelector:
          neutron.openstack.cloud.sap/ml2-mechanism-driver: ovn
    linuxbridge:
      pod:
        nodeSelector:
          neutron.openstack.cloud.sap/ml2-mechanism-driver: linuxbridge
    common:
      pod:
        tolerations:
          critical-components-not-ready:
            effect: NoSchedule
            key: node.gardener.cloud/critical-components-not-ready
          network-unavailable:
            effect: NoSchedule
            key: node.kubernetes.io/network-unavailable
          uninitialized:
            effect: NoSchedule
            key: node.cloudprovider.kubernetes.io/uninitialized
            value: "true"
        nodeSelector: {}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                  # Do not schedule without that label, we need it in the pod
                  - key: kubernetes.metal.cloud.sap/bb
                    operator: Exists

rabbitmq_ssl_client: true
rabbitmq:
  host: "neutron-rabbitmq"
  externalIPs: []
  users:
    default:
      user: rabbitmq
securitygroup:
  enable_anti_spoofing_rules: False

# true is the only valid value: false selected the containerized OVS mode,
# which was removed because a sidecar cannot own the host dataplane, and now
# fails the render.
ovsOnHost: true

# SCI sysext for the host Open vSwitch stack.
#
# The artifact is a signed release published by gardenlinux-sci. This chart
# only consumes it: it verifies the release, deploys `extensions`, merges them
# on the host, and restarts the units those extensions own. It never deploys a
# name outside `extensions`, and it never removes a name.
#
# release.url, release.sumsDigest and publicKey are set together or left empty:
#   empty — trust mode: the host provides the stack natively and the chart
#           renders no activation container (byte-identical to a host-provisioned
#           node);
#   set   — this agent's init container activates its extensions at Pod start; an
#           already converged host is a no-op verify.
#
# The existing agent image runs files/activate-sci-sysext.sh from the bin
# ConfigMap. There is no separate consumer image or workload.
# `release.url` names one build; `sumsDigest` pins the exact
# inventory, so a moved tag cannot change the bytes. Both charts on a node
# must name the same release and sumsDigest.
#
# The network DaemonSets ask for: sci-10-base, sci-21-network. The nova chart
# asks for the compute set from the same release.
sciSysext:
  release:
    url: ""
    sumsDigest: ""
  publicKey: ""
  extensions:
    - sci-10-base
    - sci-21-network

# Provider-bridge takeover on the primary NIC, performed by the
# configure-host-ovs init container (templates/bin/_configure-host-ovs.tpl).
# Leave false where the host already provides a bridged uplink.
ovs:
  # Attach publicInterface to physicalBridge and move the host's primary
  # IPv4 onto the bridge. Only enable on NICs intended for instance traffic.
  physicalBridgeTakeover: false
  # Empty = auto-detect: bond0 if present, else the default-route interface.
  publicInterface: ""
  physicalBridge: br-ovs0

agent:
  rootwrap_daemon: false
osprofiler: {}
ovn:
  external_ids: {}
vpods: {}

cc_fabric: {}

vpods_conf:
  ovs:
    # bridge_mappings: "{{ segment }}:br-ex" Set dynamically script
    enable_tunneling: False
    ovsdb_connection: "unix:/var/run/openvswitch/db.sock"

pod:
  lifecycle:
    upgrades:
      daemonsets:
        revisionHistory: 5
        updateStrategy:
          rollingUpdate:
            maxUnavailable: "10%"
  tolerations: {}

memcached:
  memcached: {}

logging_sapccsentry:
  formatters:
    context:
      class: oslo_log.formatters.ContextFormatter
    default:
      format: "%(message)s"
  handlers:
    stdout:
      class: StreamHandler
      args: "(sys.stdout,)"
      formatter: context
    "null":
      class: logging.NullHandler
      formatter: default
      args: "()"
    sentry_events:
      class: "sapcc_sentrylogger.handler.EventHandler"
      level: ERROR
      args: "()"
    sentry_breadcrumbs:
      class: "sapcc_sentrylogger.handler.BreadcrumbHandler"
      level: INFO
      args: "()"
  loggers:
    root:
      formatter: context
      handlers: stdout, sentry_events, sentry_breadcrumbs
      level: ERROR
    neutron:
      handlers: stdout, sentry_events, sentry_breadcrumbs
      level: DEBUG
    suds:
      handlers: "null"
      level: ERROR

owner-info:
  support-group: network-api
  maintainers:
    - Sebastian Lohff
    - Andrew Karpow
    - Fabian Wiesel
    - mchristianl
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/openstack/neutron-hypervisor-agent
