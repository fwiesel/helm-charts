apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bin
  labels:
    system: openstack
    type: configuration
    component: nova
data:
{{ (.Files.Glob "bin/*").AsConfig | indent 2 }}
{{- if include "sciSysext.enabled" . }}
  activate-sci-sysext: |
    {{- .Files.Get "files/activate-sci-sysext.sh" | nindent 4 }}
{{- end }}
