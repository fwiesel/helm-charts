suite: SCI sysext consumer init container (nova-hypervisor-agents)
templates:
  - templates/*.yaml
values:
  - ../ci/test-values.yaml
set:
  availability_zone: test-az
tests:
  - it: fails to render with the migration message when hypervisor_on_host is false
    template: templates/hypervisors-kvm-daemonset.yaml
    set:
      hypervisor_on_host: false
    asserts:
      - failedTemplate:
          errorPattern: "hypervisor_on_host: true"
      - failedTemplate:
          errorPattern: "sciSysext"

  - it: renders no consumer init container and no host-root volume when sciSysext is empty
    template: templates/hypervisors-kvm-daemonset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: sci-sysext-consumer
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: host-root
          any: true
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: kubernetes-entrypoint
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: nova-compute-init

  - it: refuses a partially configured sciSysext block
    template: templates/hypervisors-kvm-daemonset.yaml
    set:
      sciSysext.image: "registry.example.com/sci-consumer@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - failedTemplate:
          errorPattern: "set image, release.url, release.sumsDigest, publicKey and extensions together"

  - it: refuses a sumsDigest that is not a sha256
    template: templates/hypervisors-kvm-daemonset.yaml
    values:
      - sci-sysext-values.yaml
    set:
      sciSysext.release.sumsDigest: "not-a-digest"
    asserts:
      - failedTemplate:
          errorPattern: "sumsDigest must be 64 lowercase hex"

  - it: refuses an extension name that could traverse
    template: templates/hypervisors-kvm-daemonset.yaml
    values:
      - sci-sysext-values.yaml
    set:
      sciSysext.extensions:
        - "../sci-10-base"
    asserts:
      - failedTemplate:
          errorPattern: "invalid extension name"

  - it: renders the consumer between kubernetes-entrypoint and nova-compute-init
    template: templates/hypervisors-kvm-daemonset.yaml
    values:
      - sci-sysext-values.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: kubernetes-entrypoint
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: sci-sysext-consumer
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: "registry.example.com/sci-consumer@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: nova-compute-init

  - it: passes the release contract to the consumer
    template: templates/hypervisors-kvm-daemonset.yaml
    values:
      - sci-sysext-values.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: sci-sysext-consumer
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: HOST_ROOT
            value: /host
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: SCI_RELEASE_URL
            value: "https://github.com/gardenlinux/gardenlinux-sci/releases/download/2150.9.0-g00a1df9"
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: SCI_SUMS_DIGEST
            value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - equal:
          path: spec.template.spec.initContainers[1].env[4].name
          value: SCI_EXTENSIONS
      - equal:
          path: spec.template.spec.initContainers[1].env[4].value
          value: "sci-10-base sci-20-compute sci-22-storage sci-40-libvirt sci-50-virt-ch sci-51-virt-qemu"
      - matchRegex:
          path: spec.template.spec.initContainers[1].env[3].value
          pattern: "BEGIN PUBLIC KEY-----\nMFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAK0123456789abcdef\n-----END PUBLIC KEY-----"
      - equal:
          path: spec.template.spec.initContainers[1].env[5].name
          value: SCI_DEADLINE
      - equal:
          path: spec.template.spec.initContainers[1].env[5].value
          value: "900"
      - equal:
          path: spec.template.spec.initContainers[1].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.initContainers[1].securityContext
          value:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
            appArmorProfile:
              type: Unconfined
      - contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: host-root
            mountPath: /host
            mountPropagation: HostToContainer
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-root
            hostPath:
              path: /
              type: Directory
      - equal:
          path: spec.template.spec.hostIPC
          value: true

  - it: keeps setup-nfs after the consumer
    template: templates/hypervisors-kvm-daemonset.yaml
    values:
      - sci-sysext-values.yaml
    set:
      defaults.hypervisor.kvm.instance_nfs_share: "nfs.example.com:/exports/nova"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: kubernetes-entrypoint
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: sci-sysext-consumer
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: nova-compute-init
      - equal:
          path: spec.template.spec.initContainers[3].name
          value: setup-nfs

  - it: keeps setup-nfs when instance_nfs_share is set without a consumer
    template: templates/hypervisors-kvm-daemonset.yaml
    set:
      defaults.hypervisor.kvm.instance_nfs_share: "nfs.example.com:/exports/nova"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: kubernetes-entrypoint
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: nova-compute-init
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: setup-nfs
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: sci-sysext-consumer
          any: true

  - it: never renders the retired standalone delivery DaemonSet
    template: templates/hypervisors-kvm-daemonset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sci-sysext-delivery
        not: true
