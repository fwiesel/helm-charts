global:
  nova_service_password:
  dockerHubMirror:
  registry:
  novaConsolePortPublic: 443

osprofiler: {}
sentry: {}

rabbitmq_ssl_client: true

imageName: loci-nova
imageVersion: null
imageVersionKubernetesEntrypoint: "latest"

# true is the only valid value: false selected the in-pod libvirt mode, which
# was removed because it raced the host services, and now fails the render.
hypervisor_on_host: true

# SCI sysext for the host libvirt/QEMU stack.
#
# The artifact is a signed release published by gardenlinux-sci. This chart
# only consumes it: it verifies the release, deploys `extensions`, merges them
# on the host, and restarts the units those extensions own. It never deploys a
# name outside `extensions`, and it never removes a name.
#
# All five keys are set together, or all stay empty:
#   empty — trust mode: the host provides the stack natively and the chart
#           renders no consumer container (byte-identical to a host-provisioned
#           node);
#   set   — a one-shot init container consumes the release at Pod start; an
#           already converged host is a no-op verify.
#
# `image` is this repo's consumer image (openstack/sci-consumer), not the
# release. `release.url` names one immutable build; `sumsDigest` pins the exact
# inventory, so a moved tag cannot change the bytes. Both charts on a node
# must name the same release and sumsDigest.
#
# The compute DaemonSet asks for: sci-10-base, sci-20-compute, sci-22-storage,
# sci-40-libvirt, sci-50-virt-ch, sci-51-virt-qemu. The neutron chart asks for
# sci-10-base and sci-21-network from the same release.
sciSysext:
  image: ""
  release:
    url: ""
    sumsDigest: ""
  publicKey: ""
  extensions: []

cross_az_attach: 'False'

hypervisorAgentsServiceAccountName: null

default:
  password_all_group_samples: 2
  rpc_ping_enabled: true
  instance_name_template: "instance-%(uuid)s"

pod:
  lifecycle:
    upgrades:
      daemonsets:
        revisionHistory: 5
        updateStrategy:
          rollingUpdate:
            maxUnavailable: "10%"
  tolerations: {}


defaults:
  default:
    graceful_shutdown_timeout: 60
  hypervisor:
    common:
      default:
        reserved_host_memory_mb: 512
        disk_allocation_ratio: "1.0"
        reserved_host_disk_mb: "0"
        default_ephemeral_format: "ext4"
        block_device_allocate_retries: "2000"
      config_file:
        oslo_messaging_rabbit:
          ssl: true
    kvm:
      instance_nfs_share: null # NFS Share to mount as /var/lib/nova/instances
      # DEFAULT section of nova-compute.conf
      default:
        compute_driver: libvirt.LibvirtDriver
        firewall_driver: nova.virt.firewall.NoopFirewallDriver
        resume_guests_state_on_host_boot: false # Setting that to true breaks evacuations
        instance_build_timeout: 3600
        reboot_timeout: 3600  # an hour
        rescue_timeout: 259200 # three days
        resize_confirm_window: 259200
        # The shared NFS instances volume cannot use server-side clone
        # (EOPNOTSUPP); overlays restore seconds-scale creates.
        use_cow_images: "true"
      vnc:
        enabled: true
      serial:
        enabled: true
      config_file:
        libvirt:
          always_allocate_memory_immediately: true
          connection_uri: ch:///system
          virt_type: ch
          hw_disk_discard: unmap
          hw_machine_type: q35
          # qcow2 overlays avoid the full-size raw copy per build; raw copies
          # 3.76 GB over NFS every create and serializes on one flock.
          images_type: qcow2
          inject_key: true
          inject_password: true
          iscsi_iface: "default"
          live_migration_completion_timeout: '300'
          live_migration_inbound_addr: "$my_ip"
          live_migration_parallel_connections: '8'
          live_migration_permit_auto_converge: 'true'
          # live_migration_permit_post_copy: 'true'
          live_migration_scheme: "tls"
          live_migration_timeout_action: 'force_complete'
          live_migration_with_native_tls: 'true'
          nfs_mount_options: "rw,bg,nfsvers=4.2,hard,proto=tcp,timeo=600,nconnect=8,retrans=2,rsize=262144,wsize=262144,noatime,actimeo=0,lookupcache=pos"
          num_umount_retries: "30"
          rng_dev_path: /dev/random
          smbios_asset_tag: "SAP CCloud VM"
          umount_retry_delay: "1.0"
          volume_use_multipath: true
          cpu_mode: "custom"
          cpu_model: "sapphire-rapids"
          max_queues: 8
        os_vif_ovs:
          ovsdb_connection: "unix:/run/openvswitch/db.sock"
        workarounds:
          libvirt_use_host_maxphysaddr: true
          skip_cpu_compare_at_startup: true
          skip_cpu_compare_on_dest: true
          enable_chv_announce_self: true
      pod:
        tolerations:
          critical-components-not-ready:
            effect: NoSchedule
            key: node.gardener.cloud/critical-components-not-ready
          network-unavailable:
            effect: NoSchedule
            key: node.kubernetes.io/network-unavailable
          uninitialized:
            effect: NoSchedule
            key: node.cloudprovider.kubernetes.io/uninitialized
            value: "true"
        nodeSelector:
          kubernetes.io/os: linux
          nova.openstack.cloud.sap/virt-driver: libvirt-ch

scheduler:
  track_instance_changes: false
  scheduler_instance_sync_interval: 120

logging:
  formatters:
    context:
      class: oslo_log.formatters.ContextFormatter
    default:
      format: "%(message)s"
  handlers:
    stdout:
      class: StreamHandler
      args: "(sys.stdout,)"
      formatter: context
    "null":
      class: logging.NullHandler
      args: "()"
      formatter: default
    sentry:
      class: raven.handlers.logging.SentryHandler
      level: ERROR
      args: "()"
  loggers:
    root:
      handlers: stdout, sentry
      level: WARNING
    migrate:
      handlers: stdout, sentry
      level: INFO
    nova:
      handlers: stdout, sentry
      level: INFO
    nova.scheduler:
      handlers: stdout, sentry
      level: DEBUG
    nova.scheduler.host_manager: # You might get problems with unicodedecode errors if you decrease that
      handlers: stdout, sentry
      level: INFO
    nova.virt.vmwareapi:
      handlers: stdout, sentry
      level: DEBUG
    eventlet.wsgi.server:
      handlers: stdout, sentry
      level: INFO
    oslo.privsep:
      handlers: stdout, sentry
      level: INFO
    suds:
      handlers: "null"
      level: ERROR
    oslo_vmware.common.loopingcall:
      handlers: "null"
      level: ERROR

libvirt:
  ca:
    cert: null
    key: null

cell1:
  name: cell1

owner-info:
  support-group: compute-storage-api
  service: nova
  maintainers:
  - Johannes Kulik
  - Jakob Karge
  - Andrew Karpow
  - Fabian Wiesel
  - mchristianl
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/openstack/nova-compute-agent
